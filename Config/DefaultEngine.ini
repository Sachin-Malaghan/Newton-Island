; CURIO ISLES engine configuration. See CLAUDE.md.

[/Script/EngineSettings.GameMapsSettings]
; No authored maps: the engine's empty Entry map hosts the game; the HUD draws everything.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/CurioIsles.CIGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=0
r.Mobile.AntiAliasing=0
r.MobileHDR=False
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.RayTracing=False

[SystemSettings]
; Canvas-drawn game: render at the device's native resolution so shapes and text stay crisp on phones.
r.MobileContentScaleFactor=0

[/Script/Engine.AudioSettings]
DefaultAudioCompressionType=Opus

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; The package name is permanent after the first Google Play upload.
PackageName=com.brainrotinteractive.curioisles
StoreVersion=1
VersionDisplayName=0.1.0
ApplicationDisplayName=Curio Isles
MinSDKVersion=26
TargetSDKVersion=36
; Google Play wants an Android App Bundle (.aab); the universal APK next to it is for sideload testing.
bEnableBundle=True
bEnableUniversalAPK=True
bBundleABISplit=True
; Release signing (KeyStore, KeyAlias, KeyStorePassword) lives in Config/Android/AndroidEngine.ini,
; written by Tools/Build/create_upload_key.ps1 and git-ignored. Never put the password in this file.
Orientation=SensorLandscape
bPackageDataInsideApk=True
bFullScreen=True
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=True
bEnableGooglePlaySupport=False
; No ads yet (rewarded ads are optional, later): without this, Unreal bundles the AdMob SDK.
bSupportAdMob=False
bShowLaunchImage=False
bEnableNewKeyboard=True
; Draw into the camera-notch area so the rendered image and touch positions share one origin; the UI keeps
; clear of the notch through the safe-area insets.
bUseDisplayCutout=True
; The default (2.1) letterboxes 20:9+ phones and then maps touches against the full width (taps land
; right of the finger). The game adapts to any width, so allow very wide screens.
MaxAspectRatio=3.0

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=Curio Isles
BundleName=curioisles
BundleIdentifier=com.brainrotinteractive.curioisles
VersionInfo=0.1.0
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
PreferredLandscapeOrientation=LandscapeLeft
bSupportsMetal=True
FrameRateLock=PUFRL_60
bEnableGameCenterSupport=False
bEnableCloudKitSupport=False
bSupportsITunesFileSharing=False
bSupportsFilesApp=False
bRequiresFullScreen=True

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=19A30D90D3A24E9DAA8F6B143C580BFF
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
